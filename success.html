<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Maaz Khan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#3b82f6', dark: '#0f172a' } }
            }
        }
    </script>
</head>
<body class="bg-dark text-slate-300 font-sans antialiased min-h-screen flex items-center justify-center px-6 relative overflow-hidden">
    
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="text-center z-10 bg-slate-800/50 p-10 rounded-2xl border border-slate-700 max-w-md w-full">
        <div class="w-16 h-16 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-blue-400 text-3xl">✅</span>
        </div>
        <h1 class="text-3xl font-bold text-white mb-4">Message Sent</h1>
        <p class="text-slate-400 mb-8 leading-relaxed">
            Thanks for reaching out! I've received your message and will get back to you as soon as possible.
        </p>
        <a href="/" class="inline-block px-8 py-3 rounded-full bg-blue-600 text-white font-bold hover:bg-blue-700 transition duration-300">
            Return to Portfolio
        </a>
    </div>

</body>
</html>
